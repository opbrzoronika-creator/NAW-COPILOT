name: Build NAW Copilot APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract project ZIP
        run: |
          rm -rf app
          mkdir app
          unzip -q NAW-Copilot-Remotion-GitHub-APK.zip -d app

          find app -maxdepth 3 -type f | head -100

          PROJECT_DIR=$(find app -maxdepth 3 -name package.json -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          fi

          echo "APP_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Read app version
        working-directory: ${{ env.APP_DIR }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building NAW Copilot v$VERSION"

      - name: Install npm dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Install TypeScript
        working-directory: ${{ env.APP_DIR }}
        run: npm install -D typescript

      - name: Build web application
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Install Capacitor Android
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Locate Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Check Android SDK
        run: |
          sdkmanager --version

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Build Android APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          find "${{ env.APP_DIR }}/android/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAW-Copilot-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release APK
        run: |
          cp "${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk" \
             "NAW-Copilot-v${APP_VERSION}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: NAW Copilot v${{ env.APP_VERSION }}
          body: |
            NAW Copilot v${{ env.APP_VERSION }}

            - English-only interface
            - Orange-red logo
            - Automatic update check outside Google Play
          files: NAW-Copilot-v${{ env.APP_VERSION }}.apk
          make_latest: true
