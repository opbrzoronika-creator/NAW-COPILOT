name: Build NAW Copilot APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract project ZIP
        run: |
          rm -rf app
          mkdir app
          unzip -q NAW-Copilot-Remotion-GitHub-APK.zip -d app

          echo "Project files:"
          find app -maxdepth 3 -type f | head -100

          PROJECT_DIR=$(find app -maxdepth 3 -name package.json -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          fi

          echo "APP_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Build web application
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Install TypeScript
        working-directory: ${{ env.APP_DIR }}
        run: npm install -D typescript

      - name: Install Capacitor Android
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Build Android APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAW-Copilot-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
